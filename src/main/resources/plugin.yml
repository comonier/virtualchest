name: VirtualChest
version: '${project.version}'
main: com.comonier.virtualchest.Main
api-version: "1.21"
folia-supported: true
description: A high-performance virtual storage system with SQL/MySQL support and Admin List tools.
author: Comonier

commands:
  pv:
    description: Main command for VirtualChest. Use /pv <id>, /pv list, or /pv admin.
    usage: /pv <id|list|admin|reload>
    permission: virtualchest.use
    aliases: [vc, virtualchest]

permissions:
  virtualchest.use:
    description: Basic permission to use the virtual chest system.
    default: true
  virtualchest.admin:
    description: Allows inspecting players, using /pv list, and reloading the plugin.
    default: op
  virtualchest.*:
    description: Grant all VirtualChest permissions.
    children:
      virtualchest.use: true
      virtualchest.admin: true
