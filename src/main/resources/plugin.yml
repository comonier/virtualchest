name: VirtualChest
version: 1.3
main: com.comonier.virtualchest.Main
api-version: "1.21"
folia-supported: true

commands:
  pv:
    description: Open Virtual Chest.
    usage: /pv <number>
    aliases: [vc, virtualchest] # Adicionado aliases aqui

permissions:
  virtualchest.use:
    description: Allows the use of the virtualchest system.
    default: op
  virtualchest.admin:
    description: Allows inspecting other players' chests and reloading.
    default: op
