# ==========================================
#         VirtualChest Configuration
# ==========================================

# We officially support: en (English), pt (Portuguese), es (Spanish), ru (Russian)
# Available languages: en, pt, es, ru
# (Make sure messages_en.yml, messages_pt.yml, etc. files exist)
language: "en"

# Default chest limit for regular players without specific numeric permissions.
max_chests_per_player: 5

# Maximum number of backup files to keep in the backups folder.
# The oldest backups will be deleted when this limit is reached.
max_backups_to_keep: 30

# ==========================================
#          STORAGE SYSTEM
# ==========================================
# Choose between SQLITE (local file) or MYSQL (external database)
storage_type: "SQLITE"

mysql:
  host: "localhost"
  port: 3306
  database: "minecraft"
  username: "root"
  password: ""
  useSSL: false

# ==========================================
#          PERMISSION SYSTEM
# ==========================================
# The plugin uses a dynamic limit system based on permissions:
#
# 1. Numeric Limit:
#    Grant the permission 'virtualchest.X' (where X is a number) to set a limit.
#    Example: 'virtualchest.10' allows the player to use chests 1 through 10.
#
# 2. Admin Permission:
#    'virtualchest.admin' - Allows opening ANY chest number and inspecting
#    other players' chests using the command: /pv admin <player> <id>
#
# 3. Base Permission:
#    'virtualchest.use' - Basic permission to use the /pv command.
#    (Follows the 'max_chests_per_player' limit defined above).
# ==========================================
